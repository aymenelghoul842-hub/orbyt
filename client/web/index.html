    #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;

    <h1>Orbyt - Meet someone new, instantly</h1>

  <script>
    // Deterrents only: no website can truly block screenshots/recording (that happens in the OS).
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('dragstart', function (e) { e.preventDefault(); });
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = 0; setTimeout(function () { s.remove(); }, 450); }
    });
  </script>
