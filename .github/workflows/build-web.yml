# Builds the Flutter web app on GitHub's free servers and saves it into ./web-dist.
# Render then deploys the server + this web build together automatically.
name: Build Flutter web

on:
  push:
    branches: [main, master]
    paths: ['client/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web (same-origin server)
        working-directory: client
        run: |
          flutter pub get
          flutter build web --release --dart-define=SERVER_URL=

      - name: Copy build to web-dist
        run: |
          rm -rf web-dist
          cp -r client/build/web web-dist

      - name: Commit web-dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A web-dist
          git diff --cached --quiet && echo "No changes" || (git commit -m "Update Flutter web build" && git push)
