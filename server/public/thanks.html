<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you - Orbyt</title><meta name="robots" content="index,follow"><meta name="theme-color" content="#05060A">
<style>
:root{--bg:#05060A;--surface:#0E1018;--text:#F2F3F8;--muted:#9A9CB5;--line:rgba(255,255,255,.1);--lime:#C6FF4D;--mint:#3DF5C8;--violet:#8B6CFF}
@media (prefers-color-scheme:light){:root{--bg:#F6F6FB;--surface:#fff;--text:#14151F;--muted:#5B5D75;--line:rgba(0,0,0,.1);--lime:#4E7A00;--mint:#007F63;--violet:#5A3FE0}}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;font:16px/1.65 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);
background:radial-gradient(900px 500px at 10% -10%,rgba(139,108,255,.25),transparent 60%),radial-gradient(800px 500px at 100% 10%,rgba(61,245,200,.14),transparent 60%),var(--bg);min-height:100vh}
main{max-width:760px;margin:0 auto;padding:28px 20px 80px}
nav{display:flex;align-items:center;gap:12px;margin-bottom:36px}
nav a.brand{font-weight:800;font-size:22px;letter-spacing:-.5px;color:var(--text);text-decoration:none}
nav .tag{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--muted)}
nav .sp{flex:1}nav a.back{color:var(--muted);text-decoration:none;font-size:14px}
h1{font-size:clamp(34px,6vw,52px);line-height:1.05;letter-spacing:-1.5px;margin:0 0 8px}
h1 span{background:linear-gradient(90deg,var(--lime),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:0 0 32px}
h2{font-size:20px;margin:34px 0 8px;letter-spacing:-.3px}
p,li{color:var(--text);opacity:.88}li{margin:4px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:18px 0}
.warn{border-color:rgba(255,95,168,.5)}
a{color:var(--mint)}footer{margin-top:50px;color:var(--muted);font-size:13px}
</style></head><body><main>
<nav><a class="brand" href="/">Orbyt</a><span class="sp"></span><a class="back" href="/">&larr; Back to Orbyt</a></nav>
<h1>Thank <span>you!</span></h1><p class="sub">Your gift means a lot. &#9749;</p>
<div class="card">If your payment went through, you will receive a confirmation from the payment provider. Nothing else is needed.</div>
<p><a href="/">&larr; Back to Orbyt</a></p>

<footer>&copy; Orbyt &middot; <a href="/terms">Terms</a> &middot; <a href="/privacy">Privacy</a> &middot; <a href="/safety">Safety</a></footer>
</main></body></html>
